[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Prisma's query engine needs these targets available in the Netlify Functions runtime.
[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  PRISMA_CLI_QUERY_ENGINE_TYPE = "binary"
  PRISMA_CLIENT_ENGINE_TYPE = "binary"

# Run `npx prisma migrate deploy` manually against DATABASE_URL before/after each deploy
# (Netlify does not run migrations automatically). See README.md "Netlify Deployment".
